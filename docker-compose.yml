services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      NODE_ENV: production
      PORT: 7500
      MARIADB_HOST: mariadb
      MARIADB_PORT: 3306
      MARIADB_DATABASE: ${MARIADB_DATABASE:-k_suite}
      MARIADB_USER: ${MARIADB_USER:-k_suite}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-k_suite_password}
      MINIO_ENDPOINT: http://bucket:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-https://storage.kayliescreations.com}
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET:-public-assets}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:-private-patterns}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-k_suite_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-k_suite_minio_password}
    ports:
      - "7500:7500"
    depends_on:
      mariadb:
        condition: service_healthy
      bucket:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:7500/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - kaylies_creations

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    environment:
      NODE_ENV: production
      PORT: 7080
      BACKEND_URL: http://backend:7500
    ports:
      - "7080:7080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:7080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - kaylies_creations

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    environment:
      NODE_ENV: production
      PORT: 7081
      BACKEND_URL: http://backend:7500
    ports:
      - "7081:7081"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:7081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - kaylies_creations

  mariadb:
    build:
      context: .
      dockerfile: Dockerfile.mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_password}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-k_suite}
      MARIADB_USER: ${MARIADB_USER:-k_suite}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-k_suite_password}
    ports:
      - "7510:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - kaylies_creations

  bucket:
    build:
      context: .
      dockerfile: Dockerfile.bucket
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-k_suite_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-k_suite_minio_password}
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET:-public-assets}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:-private-patterns}
    ports:
      - "7520:9000"
    volumes:
      - ./minio_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - kaylies_creations

volumes:
  mariadb_data:

networks:
  kaylies_creations:
    driver: bridge
